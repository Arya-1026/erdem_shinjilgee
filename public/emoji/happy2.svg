<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Баяртай">
  <defs>
    <radialGradient id="face" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe46b"/><stop offset=".55" stop-color="#ffc23a"/><stop offset="1" stop-color="#ff8f2a"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#e2681c" stop-opacity="0"/><stop offset="1" stop-color="#d9601a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="shine" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6f7d" stop-opacity=".55"/><stop offset="1" stop-color="#ff6f7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".7" stop-color="#fff1c7"/><stop offset="1" stop-color="#ffe08f"/>
    </radialGradient>
    <radialGradient id="eyeW" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eadfd6"/></radialGradient>
    <clipPath id="faceClip"><circle cx="60" cy="60" r="40"/></clipPath>

  </defs>
  <style>
    .a { transform-box: view-box; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .halo { transform-origin: 60px 60px; animation: halo 4s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    .k2 { animation-delay: -.9s; } .k3 { animation-delay: -1.7s; }
    @keyframes halo { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.03); } }
    @keyframes tw   { 0%,100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }

    .wig  { transform-origin: 60px 96px; animation: wig 1.6s ease-in-out infinite; }
    .mouth { transform-origin: 60px 72px; animation: laugh .4s ease-in-out infinite alternate; }
    .note { opacity: 0; animation: note 3.2s ease-out infinite; }
    .n2 { animation-delay: -1.6s; }
    @keyframes wig   { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes laugh { from { transform: scaleY(1); } to { transform: scaleY(1.12); } }
    @keyframes note  { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 20% { opacity: 1; }
                       100% { opacity: 0; transform: translate(6px,-24px) rotate(20deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { opacity: 0 !important; } }
  </style>
  <circle class="halo a" cx="60" cy="60" r="56" fill="url(#halo)"/>
  <g fill="#fff">
    <path class="spark"    d="M14 30 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
    <path class="spark k2" d="M104 40 l1 -3 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1z"/>
    <path class="spark k3" d="M98 98 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
  </g>

  <g class="wig a">
    <circle cx="60" cy="60" r="40" fill="url(#face)"/>
    <circle cx="60" cy="60" r="40" fill="url(#rim)"/>
    <ellipse cx="44" cy="36" rx="15" ry="9" fill="url(#shine)" transform="rotate(-30 44 36)"/>
    <ellipse cx="35" cy="68" rx="9" ry="6" fill="url(#blush)"/>
    <ellipse cx="85" cy="68" rx="9" ry="6" fill="url(#blush)"/>
    <g stroke="#4a2a1c" stroke-width="4.4" stroke-linecap="round" fill="none">
      <path d="M33 55 q8 -9 16 0"/><path d="M71 55 q8 -9 16 0"/>
    </g>
    <g class="mouth a">
      <path d="M40 68 Q60 66 80 68 Q78 92 60 92 Q42 92 40 68Z" fill="#5a2318" stroke="#4a2a1c" stroke-width="2"/>
      <path d="M46 84 q14 -10 28 0 q-4 8 -14 8 q-10 0 -14 -8z" fill="#ff6f86"/>
      <path d="M41 69 Q60 67 79 69 L78.5 72 Q60 70 41.5 72Z" fill="#fff"/>
    </g>
  </g>
  <g fill="#ff9f43">
    <g class="note fb"><circle cx="18" cy="56" r="3.2"/><rect x="20" y="42" width="1.8" height="14"/><path d="M20 42 q6 2 6 6 q-2 -3 -6 -3z"/></g>
    <g class="note n2 fb"><circle cx="98" cy="54" r="3.2"/><rect x="100" y="40" width="1.8" height="14"/><path d="M100 40 q6 2 6 6 q-2 -3 -6 -3z"/></g>
  </g>
</svg>
