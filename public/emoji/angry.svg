<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Уурласан">
  <defs>
    <radialGradient id="face" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe46b"/><stop offset=".55" stop-color="#ffc23a"/><stop offset="1" stop-color="#ff8f2a"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#e2681c" stop-opacity="0"/><stop offset="1" stop-color="#d9601a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="shine" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6f7d" stop-opacity=".55"/><stop offset="1" stop-color="#ff6f7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".7" stop-color="#ffe1da"/><stop offset="1" stop-color="#ffc3b6"/>
    </radialGradient>
    <radialGradient id="eyeW" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eadfd6"/></radialGradient>
    <clipPath id="faceClip"><circle cx="60" cy="60" r="40"/></clipPath>

    <linearGradient id="heatG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".9"/><stop offset=".55" stop-color="#ff4d3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a3c" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <style>
    .a { transform-box: view-box; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .halo { transform-origin: 60px 60px; animation: halo 4s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    .k2 { animation-delay: -.9s; } .k3 { animation-delay: -1.7s; }
    @keyframes halo { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.03); } }
    @keyframes tw   { 0%,100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }

    .rage  { animation: rage 2.4s ease-in-out infinite; }
    .heat  { animation: heat 2.4s ease-in-out infinite; }
    .brow  { animation: brow 2.4s ease-in-out infinite; }
    .frown { transform-origin: 60px 84px; animation: frown 2.4s ease-in-out infinite; }
    .puff  { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puff 2.4s ease-out infinite; }
    .pr    { --dx: 14px; } .pl { --dx: -14px; }
    .pd    { animation-delay: .15s; }
    .vein  { transform-box: fill-box; transform-origin: center; animation: vein 2.4s ease-in-out infinite; }
    @keyframes heat  { 0%,100% { opacity: .15; } 45%,60% { opacity: .85; } }
    @keyframes rage  { 0%,40%,72%,100% { transform: translate(0,0); }
                       44% { transform: translate(-1.6px,0); } 48% { transform: translate(1.6px,-.5px); } 52% { transform: translate(-1.4px,.4px); }
                       56% { transform: translate(1.4px,0); } 60% { transform: translate(-1px,0); } 64% { transform: translate(1px,0); } 68% { transform: translate(0,0); } }
    @keyframes brow  { 0%,100% { transform: translateY(0); } 45%,62% { transform: translateY(2.2px); } }
    @keyframes frown { 0%,100% { transform: scale(1); } 45%,62% { transform: scale(1.12,1.25); } }
    @keyframes puff  { 0%,46% { opacity: 0; transform: translate(0,0) scale(.4); } 54% { opacity: .95; }
                       90%,100% { opacity: 0; transform: translate(var(--dx),-10px) scale(1.3); } }
    @keyframes vein  { 0%,40%,70%,100% { transform: scale(0); } 48%,62% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { opacity: 0 !important; } }
  </style>
  <circle class="halo a" cx="60" cy="60" r="56" fill="url(#halo)"/>
  <g fill="#fff">
    <path class="spark"    d="M14 30 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
    <path class="spark k2" d="M104 40 l1 -3 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1z"/>
    <path class="spark k3" d="M98 98 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
  </g>

  <ellipse cx="60" cy="106" rx="24" ry="3.2" fill="#a0403a" opacity=".2"/>
  <g class="rage a">
    <circle cx="60" cy="60" r="40" fill="url(#face)"/>
    <circle cx="60" cy="60" r="40" fill="url(#rim)"/>
    <ellipse cx="44" cy="36" rx="15" ry="9" fill="url(#shine)" transform="rotate(-30 44 36)"/>
    <rect class="heat a" x="20" y="20" width="80" height="80" fill="url(#heatG)" clip-path="url(#faceClip)"/>
    <g class="brow a" stroke="#4a2a1c" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M32 38 L51 46"/><path d="M88 38 L69 46"/>
    </g>
    <ellipse cx="45" cy="52" rx="7.5" ry="8.5" fill="url(#eyeW)" stroke="#6b3d22" stroke-width="1.2"/>
    <g class="pupil a"><circle cx="45" cy="55" r="4.4" fill="#3a2318"/><circle cx="43.4" cy="53" r="1.5" fill="#fff"/></g>
    <ellipse cx="75" cy="52" rx="7.5" ry="8.5" fill="url(#eyeW)" stroke="#6b3d22" stroke-width="1.2"/>
    <g class="pupil a"><circle cx="75" cy="55" r="4.4" fill="#3a2318"/><circle cx="73.4" cy="53" r="1.5" fill="#fff"/></g>
    <path d="M38 47 L52 50 L52 42 Z M82 47 L68 50 L68 42 Z" fill="url(#face)" opacity="0"/>
    <path class="frown a" d="M46 86 q14 -12 28 0" stroke="#4a2a1c" stroke-width="4.4" stroke-linecap="round" fill="none"/>
    <g class="vein" stroke="#d8243a" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M84 24 q2 3 5 3 M92 22 q-3 2 -3 5 M86 32 q3 -2 3 -5 M94 30 q-2 -3 -5 -3"/>
    </g>
  </g>
  <g fill="#fff" stroke="#e7dcdc" stroke-width="1">
    <g class="puff pl"><circle cx="20" cy="70" r="5"/><circle cx="15" cy="66" r="4"/><circle cx="24" cy="65" r="3.6"/></g>
    <g class="puff pl pd"><circle cx="22" cy="80" r="3.6"/><circle cx="17" cy="77" r="2.8"/></g>
    <g class="puff pr"><circle cx="100" cy="70" r="5"/><circle cx="105" cy="66" r="4"/><circle cx="96" cy="65" r="3.6"/></g>
    <g class="puff pr pd"><circle cx="98" cy="80" r="3.6"/><circle cx="103" cy="77" r="2.8"/></g>
  </g>
</svg>
