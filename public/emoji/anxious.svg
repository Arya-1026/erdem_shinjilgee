<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Түгшсэн">
  <defs>
    <radialGradient id="face" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe46b"/><stop offset=".55" stop-color="#ffc23a"/><stop offset="1" stop-color="#ff8f2a"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#e2681c" stop-opacity="0"/><stop offset="1" stop-color="#d9601a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="shine" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6f7d" stop-opacity=".55"/><stop offset="1" stop-color="#ff6f7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".7" stop-color="#ffe6dc"/><stop offset="1" stop-color="#ffcdbb"/>
    </radialGradient>
    <radialGradient id="eyeW" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eadfd6"/></radialGradient>
    <clipPath id="faceClip"><circle cx="60" cy="60" r="40"/></clipPath>

    <linearGradient id="fearG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8dff" stop-opacity=".95"/><stop offset=".7" stop-color="#7aa6ff" stop-opacity=".35"/><stop offset="1" stop-color="#7aa6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .a { transform-box: view-box; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .halo { transform-origin: 60px 60px; animation: halo 4s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    .k2 { animation-delay: -.9s; } .k3 { animation-delay: -1.7s; }
    @keyframes halo { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.03); } }
    @keyframes tw   { 0%,100% { transform: scale(.3); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }

    .shake { animation: shake .18s linear infinite; }
    .pupil { animation: dart 1.8s steps(1) infinite; }
    .sweat { animation: sweat 2.4s ease-in infinite; }
    .gasp  { transform-origin: 60px 80px; animation: gasp 1.2s ease-in-out infinite; }
    .fear  { animation: fear 2.4s ease-in-out infinite; }
    @keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-.8px,.4px); }
                       50% { transform: translate(.8px,-.3px); } 75% { transform: translate(-.5px,-.4px); } }
    @keyframes dart  { 0% { transform: translate(0,0); } 30% { transform: translate(-2.5px,-1px); } 55% { transform: translate(2.5px,-1px); } 80% { transform: translate(0,1px); } }
    @keyframes sweat { 0%,10% { transform: translate(0,0) scale(.3); opacity: 0; } 25% { transform: translate(0,0) scale(1); opacity: 1; }
                       85% { transform: translate(3px,22px) scale(1); opacity: 1; } 100% { transform: translate(3px,26px) scale(.8); opacity: 0; } }
    @keyframes gasp  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1, 1.18); } }
    @keyframes fear  { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { opacity: 0 !important; } }
  </style>
  <circle class="halo a" cx="60" cy="60" r="56" fill="url(#halo)"/>
  <g fill="#fff">
    <path class="spark"    d="M14 30 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
    <path class="spark k2" d="M104 40 l1 -3 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1z"/>
    <path class="spark k3" d="M98 98 l1.2 -3.6 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2z"/>
  </g>

  <ellipse cx="60" cy="106" rx="24" ry="3.2" fill="#a05a3a" opacity=".18"/>
  <g class="shake a">
    <circle cx="60" cy="60" r="40" fill="url(#face)"/>
    <circle cx="60" cy="60" r="40" fill="url(#rim)"/>
    <ellipse cx="44" cy="36" rx="15" ry="9" fill="url(#shine)" transform="rotate(-30 44 36)"/>
    <rect class="fear a" x="20" y="20" width="80" height="40" fill="url(#fearG)" clip-path="url(#faceClip)"/>
    <g stroke="#4a2a1c" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M33 38 q6 -5 14 -2"/><path d="M87 38 q-6 -5 -14 -2"/>
    </g>
    <ellipse cx="45" cy="52" rx="7.5" ry="10" fill="url(#eyeW)" stroke="#6b3d22" stroke-width="1.2"/>
    <g class="pupil a"><circle cx="45" cy="53" r="3.2" fill="#3a2318"/><circle cx="43.4" cy="51" r="1.5" fill="#fff"/></g>
    <ellipse cx="75" cy="52" rx="7.5" ry="10" fill="url(#eyeW)" stroke="#6b3d22" stroke-width="1.2"/>
    <g class="pupil a"><circle cx="75" cy="53" r="3.2" fill="#3a2318"/><circle cx="73.4" cy="51" r="1.5" fill="#fff"/></g>
    <ellipse class="gasp a" cx="60" cy="80" rx="9" ry="8" fill="#5a2318" stroke="#4a2a1c" stroke-width="1.8"/>
    <path d="M53 76 q7 -3 14 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>
  <g class="sweat a" style="transform-box: fill-box; transform-origin: 50% 30%">
    <path d="M92 30 q6 9 6 13 a6 6 0 0 1 -12 0 q0 -4 6 -13z" fill="#7cc4ff" stroke="#3f8fd6" stroke-width="1.4"/>
    <ellipse cx="90" cy="42" rx="1.5" ry="2.5" fill="#fff" opacity=".8"/>
  </g>
</svg>
