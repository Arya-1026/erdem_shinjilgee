<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Энергитэй дасгал">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb648"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff7c2" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd25e" stop-opacity=".5"/><stop offset="1" stop-color="#ffd25e" stop-opacity="0"/></radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa24f"/><stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3663"/><stop offset=".5" stop-color="#2f2b4d"/><stop offset="1" stop-color="#211e38"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ef"/><stop offset=".5" stop-color="#a9afc2"/><stop offset="1" stop-color="#7d8399"/>
    </linearGradient>
    <path id="boltP" d="M114 34 L70 100 H97 L84 150 L134 80 H106 Z"/>
    <clipPath id="card"><rect width="200" height="200" rx="22"/></clipPath>
  </defs>

  <style>
    .a { transform-box: view-box; }
    .rays   { transform-origin: 100px 95px; animation: spin 30s linear infinite; }
    .glow   { transform-origin: 100px 92px; animation: glow 1.4s ease-in-out infinite; }
    .boltG  { transform-origin: 102px 92px; animation: pop 1.4s ease-in-out infinite; }
    .flash  { opacity: 0; animation: flash 1.4s ease-in-out infinite; }
    .sparks { opacity: 0; animation: zap 1.4s steps(1) infinite; }
    .sp2    { animation-name: zap2; }
    .lift   { transform-origin: 100px 146px; animation: lift 1.4s cubic-bezier(.45,0,.35,1) infinite; }
    .shadow { transform-origin: 100px 176px; animation: shade 1.4s cubic-bezier(.45,0,.35,1) infinite; }
    .speed  { opacity: 0; animation: speed 1.4s ease-out infinite; }
    .p      { opacity: 0; animation: rise 2.8s ease-out infinite; }
    .p2 { animation-delay: -.9s; } .p3 { animation-delay: -1.8s; } .p4 { animation-delay: -2.3s; }
    .ring   { transform-origin: 100px 92px; opacity: 0; animation: ring 1.4s ease-out infinite; }

    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes lift  { 0%,100% { transform: translateY(0) rotate(12deg); } 45%,58% { transform: translateY(-18px) rotate(-4deg); } }
    @keyframes shade { 0%,100% { transform: scaleX(1); opacity: .25; } 45%,58% { transform: scaleX(.65); opacity: .12; } }
    @keyframes pop   { 0%,38%,100% { transform: scale(1) rotate(0); } 48% { transform: scale(1.14) rotate(-3deg); } 58% { transform: scale(.98) rotate(1deg); } 68% { transform: scale(1); } }
    @keyframes glow  { 0%,35%,100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes flash { 0%,42%,62%,100% { opacity: 0; } 48% { opacity: .75; } }
    @keyframes zap   { 0%,44% { opacity: 0; } 46% { opacity: 1; } 52% { opacity: 0; } 54% { opacity: 1; } 60%,100% { opacity: 0; } }
    @keyframes zap2  { 0%,48% { opacity: 0; } 50% { opacity: 1; } 56% { opacity: 0; } 58% { opacity: 1; } 62%,100% { opacity: 0; } }
    @keyframes ring  { 0%,44% { opacity: 0; transform: scale(.6); } 48% { opacity: .8; } 80%,100% { opacity: 0; transform: scale(1.5); } }
    @keyframes speed { 0%,10% { opacity: 0; transform: translateY(0); } 25% { opacity: .9; } 45%,100% { opacity: 0; transform: translateY(10px); } }
    @keyframes rise  { 0% { opacity: 0; transform: translateY(0) scale(.5); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-70px) scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <!-- background + sun-burst -->
    <rect width="200" height="200" fill="url(#bg)"/>
    <g class="rays a" fill="#fff3b0" opacity=".35">
      <path d="M100 95 L88 -60 H112Z"/><path d="M100 95 L88 -60 H112Z" transform="rotate(30 100 95)"/>
      <path d="M100 95 L88 -60 H112Z" transform="rotate(60 100 95)"/><path d="M100 95 L88 -60 H112Z" transform="rotate(90 100 95)"/>
      <path d="M100 95 L88 -60 H112Z" transform="rotate(120 100 95)"/><path d="M100 95 L88 -60 H112Z" transform="rotate(150 100 95)"/>
      <path d="M100 95 L88 -60 H112Z" transform="rotate(180 100 95)"/><path d="M100 95 L88 -60 H112Z" transform="rotate(210 100 95)"/>
      <path d="M100 95 L88 -60 H112Z" transform="rotate(240 100 95)"/><path d="M100 95 L88 -60 H112Z" transform="rotate(270 100 95)"/>
      <path d="M100 95 L88 -60 H112Z" transform="rotate(300 100 95)"/><path d="M100 95 L88 -60 H112Z" transform="rotate(330 100 95)"/>
    </g>

    <!-- energy particles -->
    <g fill="#fff">
      <circle class="p a"    cx="40"  cy="150" r="2.5"/>
      <path   class="p p2 a" d="M162 150 h6 M165 147 v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle class="p p3 a" cx="150" cy="160" r="2"/>
      <path   class="p p4 a" d="M52 160 h6 M55 157 v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- glow, ring, bolt -->
    <circle class="glow a" cx="100" cy="92" r="58" fill="url(#glow)"/>
    <circle class="ring a" cx="100" cy="92" r="46" fill="none" stroke="#fff" stroke-width="3"/>
    <g class="boltG a">
      <use href="#boltP" transform="translate(4 5)" fill="#c94a1c" opacity=".35"/>
      <use href="#boltP" fill="url(#bolt)" stroke="#2f2b4d" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M110 42 L80 94 H90 Z" fill="#ffd08a" opacity=".8"/>
      <use href="#boltP" class="flash a" fill="#fffbe6"/>
    </g>

    <!-- electric sparks -->
    <g class="sparks a" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M58 60 l8 6 l-6 3 l9 7"/><path d="M146 66 l-8 5 l6 3 l-9 6"/><path d="M60 118 l9 -3 l-3 6 l9 -2"/>
    </g>
    <g class="sparks sp2 a" stroke="#fff7c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M124 30 l4 8 l-5 1 l5 8"/><path d="M150 108 l-9 -2 l4 5 l-9 -1"/><path d="M76 36 l-3 8 l5 -1 l-3 8"/>
    </g>

    <!-- floor shadow -->
    <ellipse class="shadow a" cx="100" cy="176" rx="64" ry="5" fill="#8a4a12"/>

    <!-- dumbbell (lifted) -->
    <g class="lift a">
      <!-- speed lines below -->
      <g class="speed a" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9">
        <line x1="34" y1="172" x2="34" y2="182"/><line x1="42" y1="174" x2="42" y2="180"/>
        <line x1="158" y1="172" x2="158" y2="182"/><line x1="166" y1="174" x2="166" y2="180"/>
      </g>
      <rect x="40" y="141" width="120" height="10" rx="5" fill="url(#bar)" stroke="#2f2b4d" stroke-width="3"/>
      <g stroke="#7d8399" stroke-width="1.2"><path d="M84 143 v6 M89 143 v6 M94 143 v6 M106 143 v6 M111 143 v6 M116 143 v6"/></g>
      <!-- left plates -->
      <rect x="22" y="122" width="14" height="48" rx="5" fill="url(#plate)" stroke="#1b1930" stroke-width="2"/>
      <rect x="36" y="130" width="10" height="32" rx="4" fill="url(#plate)" stroke="#1b1930" stroke-width="2"/>
      <rect x="25" y="126" width="3" height="40" rx="1.5" fill="#fff" opacity=".18"/>
      <!-- right plates -->
      <rect x="154" y="130" width="10" height="32" rx="4" fill="url(#plate)" stroke="#1b1930" stroke-width="2"/>
      <rect x="164" y="122" width="14" height="48" rx="5" fill="url(#plate)" stroke="#1b1930" stroke-width="2"/>
      <rect x="167" y="126" width="3" height="40" rx="1.5" fill="#fff" opacity=".18"/>
      <rect x="18" y="142" width="5" height="8" rx="2" fill="#a9afc2" stroke="#2f2b4d" stroke-width="1.5"/>
      <rect x="177" y="142" width="5" height="8" rx="2" fill="#a9afc2" stroke="#2f2b4d" stroke-width="1.5"/>
    </g>
  </g>
</svg>
