<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="10 минутын алхалт">
  <style>
    .ink { stroke: #2f2b4d; stroke-width: 7; stroke-linecap: round; fill: none; }
    .a { transform-box: view-box; }
    /* whole body bobs twice per stride */
    .body   { animation: bob .5s ease-in-out infinite; }
    /* legs: hip at (100,112), knee at (100,136) */
    .thigh  { transform-origin: 100px 112px; animation: thigh 1s linear infinite; }
    .shin   { transform-origin: 100px 136px; animation: shin 1s linear infinite; }
    .legB, .legB .shin, .armB { animation-delay: -.5s; }
    /* arms: shoulder at (100,86) */
    .arm    { transform-origin: 100px 86px; animation: arm 1s ease-in-out infinite; }
    .sun    { transform-origin: 160px 42px; animation: pulse 3s ease-in-out infinite; }
    .cloud  { animation: drift 14s linear infinite; }
    .cloud2 { animation-duration: 22s; animation-delay: -9s; }
    .grass  { animation: slide 2s linear infinite; }

    @keyframes bob   { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-2px); } }
    @keyframes thigh { 0%,100% { transform: rotate(-24deg); } 25% { transform: rotate(0); }
                       50% { transform: rotate(24deg); } 75% { transform: rotate(0); } }
    @keyframes shin  { 0%,100% { transform: rotate(0); } 25% { transform: rotate(4deg); }
                       50% { transform: rotate(14deg); } 70% { transform: rotate(50deg); } 85% { transform: rotate(20deg); } }
    @keyframes arm   { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes drift { from { transform: translateX(220px); } to { transform: translateX(-80px); } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- sky -->
  <rect width="200" height="200" fill="#cfe7f6"/>
  <g class="sun a">
    <circle cx="160" cy="42" r="26" fill="#f7d774" opacity=".35"/>
    <circle cx="160" cy="42" r="19" fill="#f6c94c"/>
  </g>
  <g class="cloud a" fill="#fff" opacity=".9">
    <ellipse cx="0" cy="36" rx="16" ry="7"/><ellipse cx="10" cy="31" rx="10" ry="7"/>
  </g>
  <g class="cloud cloud2 a" fill="#fff" opacity=".75">
    <ellipse cx="0" cy="64" rx="12" ry="5"/><ellipse cx="7" cy="60" rx="7" ry="5"/>
  </g>

  <!-- hills -->
  <path d="M0 132 Q60 100 120 122 T200 112 V200 H0Z" fill="#a9d68c"/>
  <path d="M0 150 Q70 128 140 146 T200 140 V200 H0Z" fill="#86bf67"/>

  <!-- path -->
  <path d="M40 200 C60 175 80 165 100 160 C125 154 160 150 200 146 V158 C165 162 132 167 110 172 C88 178 72 188 66 200Z" fill="#ead6ab"/>

  <!-- grass tufts sliding by -->
  <g class="grass a" stroke="#5f9e48" stroke-width="2" stroke-linecap="round">
    <path d="M18 186 l-2 -6 M20 186 l0 -7 M22 186 l2 -6"/>
    <path d="M58 182 l-2 -5 M60 182 l0 -6 M62 182 l2 -5"/>
    <path d="M98 190 l-2 -6 M100 190 l0 -7 M102 190 l2 -6"/>
    <path d="M138 182 l-2 -5 M140 182 l0 -6 M142 182 l2 -5"/>
    <path d="M178 188 l-2 -6 M180 188 l0 -7 M182 188 l2 -6"/>
    <path d="M218 186 l-2 -6 M220 186 l0 -7 M222 186 l2 -6"/>
  </g>

  <!-- walker (faces right) -->
  <g transform="translate(0 7)"><g class="body a">
    <!-- back arm & leg first so they sit behind -->
    <g class="arm armB a"><line class="ink" x1="100" y1="86" x2="100" y2="112" opacity=".75"/></g>
    <g class="thigh legB a">
      <line class="ink" x1="100" y1="112" x2="100" y2="136" opacity=".75"/>
      <g class="shin a"><line class="ink" x1="100" y1="136" x2="100" y2="160" opacity=".75"/></g>
    </g>

    <line class="ink" x1="100" y1="82" x2="100" y2="112"/>
    <circle cx="100" cy="66" r="13" fill="#f3c29b" stroke="#2f2b4d" stroke-width="4"/>

    <g class="thigh a">
      <line class="ink" x1="100" y1="112" x2="100" y2="136"/>
      <g class="shin a"><line class="ink" x1="100" y1="136" x2="100" y2="160"/></g>
    </g>
    <g class="arm a"><line class="ink" x1="100" y1="86" x2="100" y2="112"/></g>
  </g></g>
</svg>